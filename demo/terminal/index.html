<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otaku terminal demo</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #fafafa; }
  #terminal { position: fixed; inset: 0; padding: 8px; }
  #status {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #6b7080; background: #ffffff; border: 1px solid #d9dce3;
    border-radius: 6px; padding: 4px 12px;
    font: 13px/1.4 system-ui, sans-serif; pointer-events: none;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="status">loading…</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="main.js"></script>
</body>
</html>
