# The web frontend's HTTP surface as OpenAPI — a hand-maintained
# reference. The AUTHORITY is the code: `otaku/web/api.py`'s tables
# (READS, ACTIONS, FLOWS, ANSWERS) and `otaku/web/server.py`'s fixed
# endpoints; a change to the surface updates this file in the same
# commit, and `tests/test_architecture.py` holds the path list against
# the tables so a missing or stale path fails the suite.
openapi: 3.1.0

info:
  title: otaku web API
  version: 0.4.0 # tracks the app version the surface last changed in
  description: |
    The API `otaku web` serves one open session over, on loopback by
    default. It has exactly one intended client — the packaged page —
    so it is small, unversioned, and free to change with the app: the
    page and the server always ship in the same build.

    **Lanes.** The prefix is the lane. `/api/read/…` only READS the
    session and is answered even while a reply is streaming; everything
    under `/api/do/…`, plus `/api/command` and `/api/play`, MOVES the
    story and takes the session's one thread in turn. `/api/alive` and
    `/api/watch` are in neither lane and never touch the session.

    **Guards.** Every request's `Host` must name this machine — a name
    that reached the server by pointing elsewhere is DNS rebinding and
    is answered `421` (skipped on a wildcard bind, which is the
    decision to answer everyone). Every POST must prove it came from
    otaku's own page — `Sec-Fetch-Site: same-origin`, or an `Origin`
    equal to the whole origin addressed — else `403`. A request with
    neither header (curl, a script) is let through; the bind guards
    those.

    **Refusals.** An operation declining for an expected reason is an
    ANSWER, not an error: `200` with `{"notice": …, "refused": true}` —
    the sentence is shown verbatim and only the flag is read. `400` is
    a malformed request (a missing or wrong-typed field), `404` an
    unknown path or action, `500` a bug, `503` a server on its way out.

    Beside the API, the server serves the page itself from a closed
    asset table (`/`, stylesheets, scripts, fonts, and the reader's own
    `/custom.css`) — not part of this reference.

servers:
  - url: http://localhost:9600
    description: The default [web] address in configs/config.toml.

paths:
  # ---------- neither lane ----------

  /api/alive:
    get:
      summary: The page's heartbeat
      description: |
        Answered by the handler thread itself, never the session — an
        otaku deep in a reply still answers, which is what makes this
        an answer about the SERVER. Carries the background worker's
        one-line status and the sentences it has said since the last
        beat.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alive" }

  /api/watch:
    get:
      summary: The files the page is made of, as they change
      description: |
        A server-sent event stream, held open for the life of the tab.
        The first frame names the reconnect interval (`retry:`); each
        following frame's `data:` is the bare NAME of a file that
        changed under the packaged `static/` or the reader's own state
        `web/` directory. The page swaps a stylesheet in place and
        reloads itself for anything else; a reopened stream is how a
        tab learns the server was restarted.
      responses:
        "200":
          content:
            text/event-stream: {}

  # ---------- the read lane ----------

  /api/read/session:
    get:
      summary: The session facts the header and rail draw
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facts" }

  /api/read/turns:
    get:
      summary: The open story, one row per stored turn, oldest first
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Turn" }

  /api/read/history:
    get:
      summary: The composer's ↑/↓ history, most recent first
      description: The same store-backed lines the terminal prompt walks.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/read/commands:
    get:
      summary: The shared command table
      description: |
        The one table both frontends answer (`backend.commands`), plus
        which rows THIS frontend's backend half answers with a sentence
        (`answers`) — what tells the page whether a click is a call or
        a screen.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandTable" }

  /api/read/stories:
    get:
      summary: The story browser's rows, most recently played first
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoryRow" }

  /api/read/search:
    get:
      summary: Ids of the stories matching a filter query
      description: |
        The ONE filter rule both browsers promise: a story matches on
        its current chain's text OR on its listing row's face (label,
        arc summary, first prompt, model). An empty query matches
        every indexed story.
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { type: integer }

  /api/read/story:
    get:
      summary: One story's current chain — the browser's drill-in
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Turn" }
        "400":
          description: The id is not a number.

  /api/read/lore:
    get:
      summary: The memory as the browser shows it — both lenses
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Lore"
                  - $ref: "#/components/schemas/Notice" # no story yet

  /api/read/providers:
    get:
      summary: The model picker's inventory and the provider panel
      description: An api key's VALUE is never sent — only whether one is set.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }

  /api/read/settings:
    get:
      summary: The /set family as values
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /api/read/context:
    get:
      summary: The next request, exactly as it will be sent
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextReport" }

  /api/read/usage:
    get:
      summary: What the tokens were spent on
      description: |
        A refusal (no story, nothing recorded, an unknown scope) comes
        back BESIDE the scopes rather than instead of them — the other
        tab is the way out of an empty one.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: ["", "all"] }
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Usage"
                  - $ref: "#/components/schemas/UsageRefused"

  /api/read/balance:
    get:
      summary: What each cloud account has left
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }

  /api/read/info:
    get:
      summary: Everything otaku knows about this session, in blocks
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /api/read/export:
    get:
      summary: The story as one Markdown document, and its filename
      description: Writing the file is the page's — the server never learns where.
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Export"
                  - $ref: "#/components/schemas/Notice" # nothing to export yet

  /api/read/extract:
    get:
      summary: The pending extraction pass's report
      description: |
        The poll for a pass started by `/api/do/extract` or an import.
        Answered from the run itself, never the session's thread —
        which is the point: the thread may be busy running the pass.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    type: [string, "null"]
                    description: The pass's one-line report; null while it runs.

  # ---------- the write lane ----------

  /api/play:
    post:
      summary: Play one story line, or regenerate the standing reply
      description: |
        The whole turn is ONE job on the session's thread. Validation
        is eager — invalid syntax answers as a JSON refusal before a
        byte streams, the story untouched. Otherwise the reply arrives
        as a server-sent event stream, one JSON `PlayEvent` per `data:`
        frame; closing the connection mid-stream is the cancel door,
        and what streamed is kept and recorded. With `regenerate` the
        standing reply becomes a sibling and `line` is ignored.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line: { type: string }
                regenerate: { type: boolean, default: false }
      responses:
        "200":
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PlayEvent" }
            application/json:
              schema: { $ref: "#/components/schemas/Notice" } # refused eagerly
        "503":
          description: otaku is stopping.

  /api/command:
    post:
      summary: One command line, answered with its sentence
      description: |
        The rows this frontend answers are the shared table's wired
        OPERATIONS (`web.api.ANSWERS`). A line no row matches is
        answered with the shared unknown-command sentence
        (`backend.commands.unknown_notice`), marked refused — both frontends
        refuse a typo with the same words.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "403": { description: "The write did not come from otaku's own page." }

  /api/do/land:
    post:
      summary: Land in a story at a message — resume, fork, or truncate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [story, message]
              properties:
                story: { type: integer }
                message: { type: integer }
                action:
                  type: string
                  enum: [resume, fork, truncate]
                  default: resume
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/set-system:
    post:
      summary: Set the story's premise (the system prompt)
      description: A body rather than a command line — a premise is paragraphs.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/rename-story:
    post:
      summary: Title a story — any of them, not only the open one
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [story, title]
              properties:
                story: { type: integer }
                title: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/delete-story:
    post:
      summary: Delete a story and everything it owns
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [story]
              properties:
                story: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/edit-message:
    post:
      summary: Correct one message's text
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: integer }
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/edit-lore:
    post:
      summary: Correct one lore field
      description: |
        `kind` and `target` are a Field's own address fields, exactly
        as the lore read handed them out.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
              properties:
                kind:
                  type: string
                  enum: [scene-title, scene-summary, description, card, entry, state, history]
                target: { type: integer }
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/switch-model:
    post:
      summary: Switch the session's model
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/load-model:
    post:
      summary: Load or unload a model on a managed engine
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
                loaded:
                  type: boolean
                  description: true loads, false unloads.
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/save-field:
    post:
      summary: Save a provider's url or api key
      description: |
        Sealed (keys), written surgically into providers.toml, live in
        the running registry at once. The key's value goes IN through
        here and never comes back out through any read.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, field, value]
              properties:
                provider: { type: string }
                field: { type: string, enum: [url, api_key] }
                value: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/record-history:
    post:
      summary: One submitted composer line into the ↑/↓ history
      description: |
        What the terminal prompt does at its own door — blanks and
        immediate repeats are the session's to skip. The notice is
        empty; the submission itself was the event.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/import:
    post:
      summary: Import an uploaded story document
      description: |
        An otaku export (.md), a SillyTavern chat (.jsonl), or plain
        text (.txt) — the format is detected from the name and the
        content together. Content-shaped by contract: a path over HTTP
        would name a file on the SERVER. The memoryless shapes start an
        extraction pass; `watching` says whether there is one to poll.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text, name]
              properties:
                text: { type: string }
                name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watched" }

  /api/do/prepare-card:
    post:
      summary: Read and vet a character card — everything before the persona ask
      description: |
        The prepared card stays on the server, keyed by the returned
        token; the page hands back only the token and the persona
        answer. A card left unanswered is swept after ten minutes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [data, name]
              properties:
                data: { type: string, description: "The card file, base64." }
                name: { type: string, description: "The file's own name." }
                rename: { type: string, description: "Optional cast name override." }
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PreparedCard"
                  - $ref: "#/components/schemas/Notice" # not a card / name taken

  /api/do/add-card:
    post:
      summary: Land a prepared card — everything after the persona ask
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, persona]
              properties:
                token: { type: string }
                persona: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Answered" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/CrossOrigin" }

  /api/do/extract:
    post:
      summary: Force an extraction pass now
      description: |
        The run is kept for `/api/read/extract` to poll; a pass already
        running is not doubled.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watched" }

components:
  responses:
    Answered:
      description: "The write's answer — a sentence, or a marked refusal."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Notice" }
    BadRequest:
      description: "A field the page did not send, or sent wrong."
    CrossOrigin:
      description: "The write did not come from otaku's own page."

  schemas:
    Notice:
      type: object
      description: |
        A write's answer — the sentence to show, verbatim. `refused`
        marks an expected decline; the page reads the flag, never the
        wording.
      required: [notice]
      properties:
        notice: { type: string }
        refused: { type: boolean }

    Watched:
      allOf:
        - $ref: "#/components/schemas/Notice"
        - type: object
          properties:
            watching:
              type: boolean
              description: Whether an extraction pass is running to poll for.

    Alive:
      type: object
      properties:
        status:
          type: string
          description: The background worker's one-line account; "" when idle.
        notices:
          type: array
          items: { type: string }
          description: What the worker has said since the last beat.

    Turn:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant] }
        body: { type: string }

    Facts:
      type: object
      properties:
        version: { type: string }
        model: { type: string, description: "The bare model name; \"(no model)\" when none." }
        engine: { type: string }
        context: { type: string, description: "The window, formatted; \"\" when unknown." }
        story: { type: string, description: "The open story's name; \"\" when none." }
        story_id: { type: [integer, "null"] }
        turns: { type: integer }
        system: { type: string }
        think: { type: string }
        verbose: { type: boolean }
        autocorrect: { type: boolean }
        notification: { type: boolean }

    CommandTable:
      type: object
      properties:
        prose:
          type: object
          description: The explainer row that is not a command.
          properties:
            label: { type: string }
            group: { type: string }
            description: { type: string }
        groups:
          type: object
          description: Group key → heading, in the table's own order.
          additionalProperties: { type: string }
        answers:
          type: array
          items: { type: string }
          description: The tokens this frontend answers with a sentence.
        rows:
          type: array
          items:
            type: object
            properties:
              token: { type: string }
              args: { type: string }
              description: { type: string }
              group: { type: string }
              kind: { type: string, enum: [operation, interactive, syntax] }

    StoryRow:
      type: object
      properties:
        id: { type: integer }
        label: { type: string, description: "Title, else newest rollup, else first prompt." }
        title: { type: string }
        story_so_far: { type: string }
        first_user: { type: string }
        model: { type: string }
        updated_at: { type: string, format: date-time }
        messages: { type: integer }
        open: { type: boolean, description: "Whether this is the session's open story." }

    Lore:
      type: object
      properties:
        scenes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string, description: '"4  61-84  The Crossing" — display only.' }
              span: { type: string, description: '"61-84"; "" when off the current chain.' }
              title: { type: string }
              summary: { type: string }
              present:
                type: array
                items: { type: string }
              fields:
                type: array
                items: { $ref: "#/components/schemas/LoreField" }
        cast:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              aliases:
                type: array
                items: { type: string }
              description: { type: string }
              now: { type: string, description: "The newest state line; \"\" when none." }
              fields:
                type: array
                items: { $ref: "#/components/schemas/LoreField" }

    LoreField:
      type: object
      description: One editable row of a detail view, with the address an edit names.
      properties:
        label: { type: string }
        kind:
          type: string
          enum: [scene-title, scene-summary, description, card, entry, state, history]
        text: { type: string }
        target: { type: integer }
        editable: { type: boolean }
        pivot: { type: [integer, "null"], description: "The other lens's row, when the field has a far side." }
        scene_no: { type: [integer, "null"] }

    Providers:
      type: object
      properties:
        current: { type: string, description: '"provider/model"; "" without a model.' }
        memory: { type: string, description: 'The machine''s RAM gauge, one sentence; "" when unknown.' }
        engines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              local: { type: boolean }
              connected: { type: boolean }
              url: { type: string }
              has_key: { type: boolean, description: "Whether a key is SET — never the value." }
              models:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    loaded: { type: boolean }
                    can_load_unload: { type: boolean }
                    size: { type: string }
                    context: { type: string }

    Settings:
      type: object
      properties:
        think: { type: string }
        think_levels:
          type: array
          items: { type: string }
          description: The effort ladder in its one shared order (backend.session.THINK_MENU).
        verbose: { type: boolean }
        autocorrect: { type: boolean }
        notification: { type: boolean }
        model: { type: string }
        parameters:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: string, description: '"" when at the model''s own default.' }
              type: { type: string, description: "float / int / str — how a typed value parses." }

    ContextReport:
      type: object
      properties:
        shape:
          type: object
          description: What the next request is MADE of — the diagram's arithmetic.
          properties:
            head: { type: integer }
            tail: { type: integer }
            middle: { type: integer, description: "Messages the summaries stand in for." }
            kept: { type: integer }
            summaries: { type: integer }
            rolled_up: { type: integer }
            total_tokens: { type: integer }
            system_tokens: { type: integer }
            transcript_tokens: { type: integer }
            context_max: { type: integer }
            used: { type: integer, description: "Percent of the window." }
        lede: { type: string, description: "The summary said in words." }
        parts:
          type: array
          description: One part per message, exactly as the wire will carry it.
          items:
            type: object
            properties:
              role: { type: string }
              body: { type: string }

    Usage:
      type: object
      properties:
        scope: { type: string, description: '"this story" or "all stories".' }
        scopes: { $ref: "#/components/schemas/UsageScopes" }
        rows:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              provider: { type: string }
              model: { type: string }
              requests: { type: integer }
              prompt_tokens: { type: integer }
              completion_tokens: { type: integer }
              rate: { type: number, description: "Completion tokens per second; 0.0 unmeasured." }
        requests: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    UsageRefused:
      type: object
      description: The refusal beside the scopes — the other tab is the way out.
      properties:
        notice: { type: string }
        scopes: { $ref: "#/components/schemas/UsageScopes" }

    UsageScopes:
      type: array
      items:
        type: object
        properties:
          key: { type: string }
          label: { type: string }

    Balance:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              label: { type: string }
              value: { type: string, description: "The provider's own string — never a number to format." }

    Info:
      type: object
      properties:
        sections:
          type: array
          items:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: array
                  description: One labelled fact — [label, value].
                  prefixItems:
                    - { type: string }
                    - { type: string }
              note: { type: string, description: "The sentence standing where a block's facts would be." }

    Export:
      type: object
      properties:
        name: { type: string, description: "The filename to save under." }
        text: { type: string, description: "The whole Markdown document." }

    PreparedCard:
      type: object
      properties:
        token: { type: string, description: "Hands the card back to /api/do/add-card." }
        card:
          type: object
          properties:
            name: { type: string }
            notes:
              type: array
              items: { type: string }
            tokens: { type: integer, description: "The composed block's cost estimate." }
            large: { type: boolean, description: "Worth warning — it rides every request." }
            persona: { type: string, description: "The remembered {{user}} name; \"\" when none." }

    PlayEvent:
      description: One frame of the reply stream, keyed by `type`.
      oneOf:
        - type: object
          description: The user's turn landed — echo it.
          properties:
            type: { const: recorded }
            turn: { $ref: "#/components/schemas/Turn" }
        - type: object
          properties:
            type: { const: thinking }
            text: { type: string }
        - type: object
          properties:
            type: { const: text }
            text: { type: string }
        - type: object
          description: The stream declines mid-way; what already happened stands.
          properties:
            type: { const: declined }
            reason: { type: string }
        - type: object
          description: The stream failed; what streamed is kept and recorded.
          properties:
            type: { const: failed }
            reason: { type: string }
        - type: object
          description: The turn's end.
          properties:
            type: { const: done }
            stats: { type: string, description: "The verbose stats line; \"\" when off." }
